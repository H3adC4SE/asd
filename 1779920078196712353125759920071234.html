<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Audio & Video Player Widget</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #000000;
            --wave-played: #2c3135;
            --wave-remaining: #d1d5db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .tab-nav {
            display: flex;
            background-color: #f3f4f6;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            max-height: 60px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease;
            opacity: 1;
        }

        .tab-nav.hidden-tabs {
            max-height: 0 !important;
            border-bottom: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            background: none;
            border: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background-color: #ffffff;
        }

        .tab-panel { display: none; width: 100%; flex: 1; }
        .tab-panel.active { display: flex; flex-direction: column; }

        .manager-view {
            padding: 24px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .dashboard-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }

        .upload-zone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
            background-color: #fafafa;
        }

        .upload-zone:hover { border-color: var(--accent); background-color: #f3f4f6; }
        .upload-zone i { font-size: 36px; color: var(--text-muted); margin-bottom: 12px; }
        .upload-zone p { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

        #file-input { display: none; }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus { border-color: var(--accent); }

        .primary-btn {
            width: 100%;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .track-list-container {
            margin-top: 30px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            background-color: #f9fafb;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .track-item.active { background-color: #f3f4f6; border-color: var(--accent); }
        .track-item-info { flex: 1; overflow: hidden; }

        .track-item-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .track-actions { display: flex; gap: 4px; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            font-size: 14px;
            padding: 6px;
        }

        .action-btn.edit-btn:hover { color: #2563eb; }
        .action-btn.delete-btn:hover { color: #dc2626; }

        .player-view {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top-bar i { font-size: 20px; color: var(--accent); cursor: pointer; padding: 4px; }

        .fa-chevron-down { transition: transform 0.3s ease; }
        .fa-chevron-down.inverted { transform: rotate(180deg); }

        .track-info {
            font-size: 17px;
            font-weight: 400;
            color: #2c2c2c;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.3px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stage-viewport-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 30px;
            position: relative;
        }

        .album-art-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #eef1f4, #e0e5ec);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 35px -5px rgba(0,0,0,0.35), 0 10px 15px -5px rgba(0,0,0,0.2);
        }

        .native-video-render {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 24px;
            background-color: #000000;
            box-shadow: 0 20px 35px -5px rgba(0,0,0,0.35);
            display: none;
        }

        .audio-wave-icon { display: flex; align-items: center; gap: 3px; }

        .audio-wave-icon span {
            display: block;
            width: 3px;
            background-color: #4a5568;
            border-radius: 2px;
        }

        .audio-wave-icon span:nth-child(1), .audio-wave-icon span:nth-child(5) { height: 12px; }
        .audio-wave-icon span:nth-child(2), .audio-wave-icon span:nth-child(4) { height: 18px; }
        .audio-wave-icon span:nth-child(3) { height: 24px; }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-bottom: 24px;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .play-pause-btn {
            width: 52px;
            height: 52px;
            background-color: var(--accent);
            color: #ffffff;
            border-radius: 50%;
            font-size: 16px;
        }

        .time-badge {
            background-color: #4e5359;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            margin-bottom: 24px;
        }

        .time-badge span { opacity: 0.5; }

        .waveform-scroll-window {
            width: 100%;
            height: 50px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .waveform-container {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 100%;
            width: 100%;
        }

        .wave-bar { flex: 1; height: 10px; border-radius: 1px; pointer-events: none; }
        .wave-bar.played { background-color: var(--wave-played); }
        .wave-bar.remaining { background-color: var(--wave-remaining); }

        /* Loading indicator for iOS audio decode */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff40;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .play-pause-btn.loading .fa-play,
        .play-pause-btn.loading .fa-pause { display: none; }
        .play-pause-btn.loading .loading-spinner { display: block; }
    </style>
</head>
<body>

    <div class="tab-nav" id="main-tabs">
        <button class="tab-btn active" onclick="switchPanelTab('manager')">
            <i class="fa-solid fa-folder-open"></i> 1. Select Asset
        </button>
        <button class="tab-btn" onclick="switchPanelTab('player')">
            <i class="fa-solid fa-compact-disc"></i> 2. Player Screen
        </button>
    </div>

    <div id="panel-manager" class="tab-panel active">
        <div class="manager-view">
            <div class="dashboard-title">Select & Manage Assets</div>

            <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-photo-film"></i>
                <p>Click to upload <strong>MP3 Audio</strong> or <strong>MP4 Video</strong> tracks</p>
                <p style="font-size: 11px; margin-top: 5px; color: #22c55e;">(iOS compatible — tap to select from Files or Photos)</p>
                <!--
                    iOS FIX #1: accept="audio/*,video/mp4" is correct.
                    Do NOT use capture attribute — it prevents file picker from showing on iOS.
                    The input must be triggered by a direct user tap (which this upload-zone does).
                -->
                <input type="file" id="file-input" accept="audio/*,video/mp4">
            </div>

            <!-- URL Import Section -->
            <div style="margin-bottom: 24px;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <div style="flex:1; height:1px; background:#e5e7eb;"></div>
                    <span style="font-size:12px; font-weight:600; color:#9ca3af; white-space:nowrap;">OR ADD BY URL</span>
                    <div style="flex:1; height:1px; background:#e5e7eb;"></div>
                </div>
                <div style="display:flex; gap:8px;">
                    <input type="url" id="url-import-input" placeholder="https://example.com/song.mp3"
                        style="flex:1; padding:12px; border:1px solid #d1d5db; border-radius:8px; font-size:13px; outline:none; min-width:0;"
                        inputmode="url" autocorrect="off" autocapitalize="none" spellcheck="false">
                    <button id="url-import-btn"
                        style="padding:12px 16px; background:#000; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; flex-shrink:0;">
                        + Add
                    </button>
                </div>
                <p style="font-size:11px; color:#9ca3af; margin-top:6px;">Paste a direct link to an MP3, M4A, AAC, OGG, or MP4 file</p>
                <div id="url-error-msg" style="display:none; font-size:12px; color:#dc2626; margin-top:6px;"></div>
            </div>

            <input type="hidden" id="edit-index" value="-1">

            <div class="form-group">
                <label id="form-action-label" for="track-name-input">Track Identity Title Text</label>
                <input type="text" id="track-name-input" placeholder="Configure displayed text configuration override">
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label for="fake-min-input">Fake Duration (Min)</label>
                    <input type="number" id="fake-min-input" placeholder="e.g. 2" min="0">
                </div>
                <div>
                    <label for="fake-sec-input">Fake Duration (Sec)</label>
                    <input type="number" id="fake-sec-input" placeholder="e.g. 21" min="0" max="59">
                </div>
            </div>

            <button class="primary-btn" id="save-track-btn">Apply Asset Metadata Modifications</button>

            <div class="track-list-container">
                <div id="track-list-target"></div>
            </div>
        </div>
    </div>

    <div id="panel-player" class="tab-panel">
        <div class="player-view">
            <div class="top-bar">
                <i class="fa-solid fa-chevron-down" id="collapse-chevron-btn"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>

            <div class="track-info" id="player-track-title">No track loaded...</div>

            <div class="stage-viewport-container">
                <div class="album-art-container" id="dom-audio-placeholder-cover">
                    <div class="audio-wave-icon">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <!--
                    iOS FIX #2: both playsinline AND webkit-playsinline are required
                    for inline playback on iOS Safari (older versions need the webkit prefix).
                    Without these, iOS forces fullscreen video and blocks autoplay entirely.
                -->
                <video class="native-video-render" id="native-video-node"
                       playsinline webkit-playsinline muted></video>
            </div>

            <div class="controls">
                <button class="control-btn" id="prev-btn">
                    <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="4" x2="5" y2="20"></line></svg>
                </button>
                <button class="control-btn play-pause-btn" id="play-btn">
                    <i class="fa-solid fa-play" id="play-icon"></i>
                    <div class="loading-spinner"></div>
                </button>
                <button class="control-btn" id="next-btn">
                    <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="4" x2="19" y2="20"></line></svg>
                </button>
            </div>

            <div class="time-badge" id="player-time-badge">00:00 <span>| 00:00</span></div>

            <div class="waveform-scroll-window" id="waveform-window">
                <div class="waveform-container" id="waveform-track-timeline"></div>
            </div>
        </div>
    </div>

    <!--
        iOS FIX #3: Remove preload="auto" — iOS Safari ignores it and it can
        actually interfere with src assignment timing. Let iOS load on demand.
    -->
    <audio id="native-audio-node"></audio>

    <script>
        let tracks = [
            { name: "4. ONDEADON - Tito Double P", url: "", type: "audio", isPlaceholder: true, placeholderDuration: 141, fakeDuration: 141 },
            { name: "1. Dembow Belico - Luis R Conriquez", url: "", type: "audio", isPlaceholder: true, placeholderDuration: 185, fakeDuration: 185 },
            { name: "2. AMG - Peso Pluma x Natanael Cano", url: "", type: "audio", isPlaceholder: true, placeholderDuration: 164, fakeDuration: 164 }
        ];

        let currentTrackIndex = 0;
        const barResolutionDensity = 75;
        let waveformHeightsMap = [];
        let mockPlaceholderTime = 73;
        let activePlaybackEngineNode = null;

        // iOS FIX #4: Track whether audio context has been unlocked.
        // iOS Safari silently blocks ALL audio until the user has tapped something
        // that directly calls .play() in the same synchronous call stack.
        // We unlock it once on first user tap.
        let audioContextUnlocked = false;

        const audioEngineNode = document.getElementById('native-audio-node');
        const videoEngineNode = document.getElementById('native-video-node');
        const audioCoverPlaceholder = document.getElementById('dom-audio-placeholder-cover');
        const playerTrackTitle = document.getElementById('player-track-title');
        const playerTimeBadge = document.getElementById('player-time-badge');
        const playIcon = document.getElementById('play-icon');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const waveformTimeline = document.getElementById('waveform-track-timeline');
        const waveformWindow = document.getElementById('waveform-window');
        const trackListTarget = document.getElementById('track-list-target');
        const trackNameInput = document.getElementById('track-name-input');
        const fakeMinInput = document.getElementById('fake-min-input');
        const fakeSecInput = document.getElementById('fake-sec-input');
        const saveTrackBtn = document.getElementById('save-track-btn');
        const editIndexInput = document.getElementById('edit-index');
        const formActionLabel = document.getElementById('form-action-label');
        const fileInput = document.getElementById('file-input');

        // iOS FIX #5: Unlock audio engine on the very first user gesture.
        // We do this by calling .play() then immediately .pause() on a silent src.
        // This gesture-based unlock persists for the page session on iOS.
        function unlockAudioForIOS() {
            if (audioContextUnlocked) return;
            audioContextUnlocked = true;

            // Play a zero-duration silent buffer to satisfy iOS gesture requirement
            const silentUnlock = new Audio();
            silentUnlock.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
            silentUnlock.volume = 0;
            const unlockPromise = silentUnlock.play();
            if (unlockPromise !== undefined) {
                unlockPromise.then(() => silentUnlock.pause()).catch(() => {});
            }
        }

        window.switchPanelTab = function(targetPanel) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            if (targetPanel === 'manager') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('panel-manager').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('panel-player').classList.add('active');
                loadTargetTrackInstance(currentTrackIndex, false);
            }
        };

        function initializeApplication() {
            generateWaveformTemplateProfile();
            renderDashboardPlaylist();
            loadTargetTrackInstance(currentTrackIndex, false);
            setupEventInteractions();

            window.addEventListener('resize', () => {
                loadTargetTrackInstance(currentTrackIndex, false);
            });

            const chevronBtn = document.getElementById('collapse-chevron-btn');
            const tabHeaderMenu = document.getElementById('main-tabs');

            chevronBtn.addEventListener('click', () => {
                tabHeaderMenu.classList.toggle('hidden-tabs');
                chevronBtn.classList.toggle('inverted');
            });

            // iOS FIX #6: Unlock audio on ANY first touch anywhere on the document.
            // This ensures it's ready before the user even taps play.
            document.addEventListener('touchstart', unlockAudioForIOS, { once: true, passive: true });
            document.addEventListener('mousedown', unlockAudioForIOS, { once: true, passive: true });
        }

        function generateWaveformTemplateProfile() {
            waveformHeightsMap = [];
            for (let i = 0; i < barResolutionDensity; i++) {
                let height = 14 + Math.sin(i * 0.22) * 12 + Math.cos(i * 0.45) * 8;
                height = Math.max(8, Math.min(46, height));
                waveformHeightsMap.push(height);
            }
        }

        function formatTimeMetrics(totalSeconds) {
            if (isNaN(totalSeconds) || totalSeconds < 0) return "00:00";
            const mins = Math.floor(totalSeconds / 60);
            const secs = Math.floor(totalSeconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function setLoadingState(isLoading) {
            if (isLoading) {
                playBtn.classList.add('loading');
            } else {
                playBtn.classList.remove('loading');
            }
        }

        function loadTargetTrackInstance(index, triggerPlayback = false) {
            if (index < 0 || index >= tracks.length) return;

            audioEngineNode.pause();
            videoEngineNode.pause();
            setLoadingState(false);

            currentTrackIndex = index;
            const track = tracks[currentTrackIndex];

            playerTrackTitle.innerText = track.name;

            if (track.type === "video") {
                activePlaybackEngineNode = videoEngineNode;
                audioCoverPlaceholder.style.display = "none";
                videoEngineNode.style.display = "block";

                videoEngineNode.src = track.url;
                // iOS FIX #7: Do NOT call .load() before .play() for video —
                // call load only to reset, then let play() handle loading.
                videoEngineNode.currentTime = 0;
                videoEngineNode.onloadedmetadata = () => calculateAndSyncFakeProgress();

            } else {
                activePlaybackEngineNode = audioEngineNode;
                audioCoverPlaceholder.style.display = "flex";
                videoEngineNode.style.display = "none";

                if (track.isPlaceholder) {
                    // iOS FIX #8: Clear src completely for placeholder tracks.
                    // Setting src="" on iOS can throw a MediaError — use removeAttribute instead.
                    audioEngineNode.removeAttribute('src');
                    updateWaveformScrubView(mockPlaceholderTime, track.fakeDuration || track.placeholderDuration);
                } else {
                    // iOS FIX #9: Assign src directly — do NOT call .load() separately.
                    // On iOS Safari, calling .load() resets the element and can cause
                    // the subsequent .play() to be treated as a non-gesture call.
                    audioEngineNode.src = track.url;
                    audioEngineNode.currentTime = 0;
                    audioEngineNode.onloadedmetadata = () => calculateAndSyncFakeProgress();
                }
            }

            if (triggerPlayback && activePlaybackEngineNode && !track.isPlaceholder) {
                // iOS FIX #10: Always chain .play() with .catch() to handle the
                // NotAllowedError that iOS throws when gesture requirements aren't met.
                // Show a loading spinner while the media is buffering on mobile.
                setLoadingState(true);
                const playPromise = activePlaybackEngineNode.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => setLoadingState(false))
                        .catch(err => {
                            setLoadingState(false);
                            console.warn('iOS playback blocked:', err.name, err.message);
                            // Don't alert — just silently update UI to show paused state
                            updatePlayPauseButtonUIState();
                        });
                }
            }

            updatePlayPauseButtonUIState();
            renderDashboardPlaylist();
        }

        function calculateAndSyncFakeProgress() {
            const track = tracks[currentTrackIndex];
            if (!activePlaybackEngineNode || track.isPlaceholder) return;

            const nativeCurrent = activePlaybackEngineNode.currentTime;
            const nativeDuration = activePlaybackEngineNode.duration || 1;
            const targetFakeMax = track.fakeDuration || nativeDuration;

            const progressRatio = nativeCurrent / nativeDuration;
            const computedFakeCurrentTime = progressRatio * targetFakeMax;

            updateWaveformScrubView(computedFakeCurrentTime, targetFakeMax);
        }

        function updateWaveformScrubView(currentSeconds, totalDuration) {
            totalDuration = totalDuration || 120;
            const progressRatio = Math.min(1, Math.max(0, currentSeconds / totalDuration));
            const splitActiveIndex = Math.floor(progressRatio * barResolutionDensity);

            playerTimeBadge.innerHTML = `${formatTimeMetrics(currentSeconds)} <span>| ${formatTimeMetrics(totalDuration)}</span>`;

            waveformTimeline.innerHTML = '';
            for (let i = 0; i < barResolutionDensity; i++) {
                const bar = document.createElement('div');
                bar.classList.add('wave-bar');
                bar.style.height = `${waveformHeightsMap[i]}px`;
                bar.classList.add(i <= splitActiveIndex ? 'played' : 'remaining');
                waveformTimeline.appendChild(bar);
            }
        }

        function updatePlayPauseButtonUIState() {
            const isPlaying = activePlaybackEngineNode &&
                              !activePlaybackEngineNode.paused &&
                              activePlaybackEngineNode.src !== "" &&
                              activePlaybackEngineNode.getAttribute('src') !== null;

            playIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        function setupEventInteractions() {
            const syncProgressHandler = () => {
                const track = tracks[currentTrackIndex];
                if (!track.isPlaceholder) calculateAndSyncFakeProgress();
            };

            audioEngineNode.addEventListener('timeupdate', syncProgressHandler);
            videoEngineNode.addEventListener('timeupdate', syncProgressHandler);

            const playStateUIHandler = () => {
                setLoadingState(false);
                updatePlayPauseButtonUIState();
            };

            audioEngineNode.addEventListener('play', playStateUIHandler);
            audioEngineNode.addEventListener('pause', playStateUIHandler);
            videoEngineNode.addEventListener('play', playStateUIHandler);
            videoEngineNode.addEventListener('pause', playStateUIHandler);

            // Show loading spinner while iOS buffers
            audioEngineNode.addEventListener('waiting', () => setLoadingState(true));
            audioEngineNode.addEventListener('canplay', () => setLoadingState(false));
            videoEngineNode.addEventListener('waiting', () => setLoadingState(true));
            videoEngineNode.addEventListener('canplay', () => setLoadingState(false));

            const trackEndRouteHandler = () => executeNavigationStep(1);
            audioEngineNode.addEventListener('ended', trackEndRouteHandler);
            videoEngineNode.addEventListener('ended', trackEndRouteHandler);

            // iOS FIX #11: The play button handler must call .play() SYNCHRONOUSLY
            // within the tap event — no setTimeout, no await, no promise chains before it.
            // iOS checks that .play() is called in the same call stack as the user gesture.
            playBtn.addEventListener('click', () => {
                unlockAudioForIOS(); // ensure unlocked on tap

                const track = tracks[currentTrackIndex];

                if (track.isPlaceholder) {
                    alert("This placeholder requires a real audio file upload first.");
                    return;
                }

                if (!activePlaybackEngineNode) return;

                if (activePlaybackEngineNode.paused) {
                    // SYNCHRONOUS play() call — required by iOS
                    setLoadingState(true);
                    const p = activePlaybackEngineNode.play();
                    if (p !== undefined) {
                        p.then(() => setLoadingState(false))
                         .catch(err => {
                             setLoadingState(false);
                             console.warn('Play blocked:', err.name);
                             updatePlayPauseButtonUIState();
                         });
                    }
                } else {
                    activePlaybackEngineNode.pause();
                }

                updatePlayPauseButtonUIState();
            });

            prevBtn.addEventListener('click', () => executeNavigationStep(-1));
            nextBtn.addEventListener('click', () => executeNavigationStep(1));

            waveformWindow.addEventListener('click', (e) => {
                const track = tracks[currentTrackIndex];
                const rect = waveformWindow.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const ratio = Math.min(1, Math.max(0, clickX / rect.width));

                if (track.isPlaceholder) {
                    const targetFakeMax = track.fakeDuration || track.placeholderDuration;
                    mockPlaceholderTime = Math.floor(ratio * targetFakeMax);
                    updateWaveformScrubView(mockPlaceholderTime, targetFakeMax);
                } else if (activePlaybackEngineNode && activePlaybackEngineNode.duration) {
                    activePlaybackEngineNode.currentTime = ratio * activePlaybackEngineNode.duration;
                    calculateAndSyncFakeProgress();
                }
            });

            fileInput.addEventListener('change', (e) => handleImportedFilesList(e.target.files));
        }

        function executeNavigationStep(direction) {
            let target = currentTrackIndex + direction;
            if (target < 0) target = tracks.length - 1;
            if (target >= tracks.length) target = 0;
            mockPlaceholderTime = 0;
            loadTargetTrackInstance(target, true);
        }

        function handleImportedFilesList(filesList) {
            if (!filesList || filesList.length === 0) return;
            const file = filesList[0];

            let detectedAssetType = "";
            if (file.type.startsWith('audio/')) {
                detectedAssetType = "audio";
            } else if (file.type === "video/mp4" || file.type.startsWith('video/')) {
                detectedAssetType = "video";
            } else {
                alert("Unsupported format. Please upload MP3 audio or MP4 video.");
                return;
            }

            // iOS FIX #12: Use FileReader to convert to base64 data URL instead of
            // createObjectURL. On iOS Safari, blob: URLs for audio are unreliable —
            // they can silently fail to load or produce MediaError 4 (MEDIA_ERR_SRC_NOT_SUPPORTED).
            // A data: URL embeds the file directly and works consistently across all iOS versions.
            const reader = new FileReader();
            reader.onload = function(ev) {
                const dataUrl = ev.target.result;
                const cleanName = file.name.replace(/\.[^/.]+$/, "");

                const newTrack = {
                    name: cleanName,
                    url: dataUrl,
                    type: detectedAssetType,
                    isPlaceholder: false,
                    fakeDuration: null
                };

                tracks.push(newTrack);
                renderDashboardPlaylist();
                switchPanelTab('player');
                loadTargetTrackInstance(tracks.length - 1, true);
            };
            reader.onerror = () => alert("Failed to read file. Please try again.");
            reader.readAsDataURL(file);
        }

        function renderDashboardPlaylist() {
            trackListTarget.innerHTML = '';
            tracks.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `track-item ${idx === currentTrackIndex ? 'active' : ''}`;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.action-btn')) return;
                    loadTargetTrackInstance(idx, true);
                    switchPanelTab('player');
                });

                let displayDuration = "";
                if (track.isPlaceholder) {
                    displayDuration = formatTimeMetrics(track.fakeDuration || track.placeholderDuration);
                } else if (track.fakeDuration) {
                    displayDuration = formatTimeMetrics(track.fakeDuration) + " (Spoofed)";
                } else {
                    displayDuration = "Native Dynamic Time";
                }

                const typeIcon = track.type === 'video'
                    ? '<i class="fa-solid fa-video"></i>'
                    : '<i class="fa-solid fa-music"></i>';

                item.innerHTML = `
                    <div class="track-item-info">
                        <div class="track-item-name">${track.name}</div>
                        <div class="track-item-meta">
                            <span style="margin-right: 10px;">${typeIcon} ${track.type.toUpperCase()}</span>
                            <span>${displayDuration}</span>
                        </div>
                    </div>
                    <div class="track-actions">
                        <button class="action-btn edit-btn" onclick="openMetadataEditor(event, ${idx})"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="action-btn delete-btn" onclick="removeTrackInstance(event, ${idx})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                trackListTarget.appendChild(item);
            });
        }

        window.openMetadataEditor = function(event, idx) {
            event.stopPropagation();
            const targetTrack = tracks[idx];
            trackNameInput.value = targetTrack.name;
            editIndexInput.value = idx;
            formActionLabel.innerText = `Edit Properties (Track #${idx + 1}):`;

            if (targetTrack.fakeDuration) {
                fakeMinInput.value = Math.floor(targetTrack.fakeDuration / 60);
                fakeSecInput.value = Math.floor(targetTrack.fakeDuration % 60);
            } else {
                fakeMinInput.value = "";
                fakeSecInput.value = "";
            }
            trackNameInput.focus();
        };

        saveTrackBtn.addEventListener('click', () => {
            const inputVal = trackNameInput.value.trim();
            const targetIdx = parseInt(editIndexInput.value, 10);

            if (!inputVal) return;

            if (targetIdx > -1 && targetIdx < tracks.length) {
                tracks[targetIdx].name = inputVal;

                const mins = parseInt(fakeMinInput.value, 10) || 0;
                const secs = parseInt(fakeSecInput.value, 10) || 0;
                const calculatedFakeSeconds = (mins * 60) + secs;

                tracks[targetIdx].fakeDuration = calculatedFakeSeconds > 0 ? calculatedFakeSeconds : null;

                if (targetIdx === currentTrackIndex) {
                    playerTrackTitle.innerText = inputVal;
                    if (tracks[targetIdx].isPlaceholder) {
                        updateWaveformScrubView(mockPlaceholderTime, tracks[targetIdx].fakeDuration || tracks[targetIdx].placeholderDuration);
                    } else {
                        calculateAndSyncFakeProgress();
                    }
                }

                editIndexInput.value = "-1";
                trackNameInput.value = "";
                fakeMinInput.value = "";
                fakeSecInput.value = "";
                formActionLabel.innerText = "Track Title Display Text";
                renderDashboardPlaylist();
            }
        });

        window.removeTrackInstance = function(event, idx) {
            event.stopPropagation();
            if (tracks.length <= 1) return;
            tracks.splice(idx, 1);
            if (currentTrackIndex >= tracks.length) currentTrackIndex = tracks.length - 1;
            loadTargetTrackInstance(currentTrackIndex, false);
        };

        // URL Import Handler
        const urlImportInput = document.getElementById('url-import-input');
        const urlImportBtn = document.getElementById('url-import-btn');
        const urlErrorMsg = document.getElementById('url-error-msg');

        function showUrlError(msg) {
            urlErrorMsg.textContent = msg;
            urlErrorMsg.style.display = 'block';
        }
        function clearUrlError() {
            urlErrorMsg.style.display = 'none';
            urlErrorMsg.textContent = '';
        }

        function guessTypeFromUrl(url) {
            const clean = url.split('?')[0].toLowerCase();
            if (clean.endsWith('.mp4') || clean.endsWith('.mov') || clean.endsWith('.webm')) return 'video';
            return 'audio'; // default
        }

        function nameFromUrl(url) {
            try {
                const path = new URL(url).pathname;
                const parts = path.split('/').filter(Boolean);
                const last = parts[parts.length - 1] || 'Untitled Track';
                return decodeURIComponent(last.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '));
            } catch(e) {
                return 'Untitled Track';
            }
        }

        function handleUrlImport() {
            clearUrlError();
            const rawUrl = urlImportInput.value.trim();

            if (!rawUrl) { showUrlError('Please enter a URL.'); return; }

            let parsedUrl;
            try { parsedUrl = new URL(rawUrl); }
            catch(e) { showUrlError("That doesn't look like a valid URL. Make sure it starts with https://"); return; }

            if (parsedUrl.protocol !== 'https:' && parsedUrl.protocol !== 'http:') {
                showUrlError('Only http:// and https:// URLs are supported.');
                return;
            }

            const assetType = guessTypeFromUrl(rawUrl);
            const trackName = nameFromUrl(rawUrl);

            const newTrack = {
                name: trackName,
                url: rawUrl,
                type: assetType,
                isPlaceholder: false,
                fakeDuration: null,
                isUrl: true
            };

            tracks.push(newTrack);
            renderDashboardPlaylist();
            urlImportInput.value = '';

            // Pre-fill name editor so user can rename right away
            trackNameInput.value = trackName;
            editIndexInput.value = tracks.length - 1;
            formActionLabel.innerText = 'Rename track (optional):';

            switchPanelTab('player');
            loadTargetTrackInstance(tracks.length - 1, true);
        }

        urlImportBtn.addEventListener('click', handleUrlImport);
        urlImportInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleUrlImport(); });
        urlImportInput.addEventListener('focus', () => { urlImportInput.style.borderColor = '#000'; });
        urlImportInput.addEventListener('blur', () => { urlImportInput.style.borderColor = '#d1d5db'; });

        initializeApplication();
    </script>
</body>
</html>
