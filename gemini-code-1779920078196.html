<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Audio Player & Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #000000;
            --wave-played: #2c3135;
            --wave-remaining: #d1d5db;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Responsive Layout Grid */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            align-items: start;
        }

        /* Left Panel: Track Management Dashboard */
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
        }

        .dashboard-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Custom File Upload Drag & Drop Area */
        .upload-zone {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 24px;
            background-color: #fafafa;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background-color: #f3f4f6;
        }

        .upload-zone i {
            font-size: 32px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .upload-zone p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .upload-zone strong {
            color: var(--accent);
        }

        #file-input {
            display: none;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .primary-btn {
            width: 100%;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .primary-btn:hover {
            background-color: #1f2937;
        }

        /* Track List UI */
        .track-list-container {
            margin-top: 30px;
            border-top: 1px solid #e5e7eb;
            padding-top: 24px;
        }

        .track-list-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #374151;
        }

        .track-list {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            background-color: #f9fafb;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .track-item:hover {
            background-color: #f3f4f6;
        }

        .track-item.active {
            background-color: #f3f4f6;
            border-color: var(--accent);
        }

        .track-item-info {
            flex: 1;
            padding-right: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-item-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            gap: 10px;
        }

        .track-actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            font-size: 14px;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background-color: #e5e7eb;
        }

        .action-btn.edit-btn:hover { color: #2563eb; }
        .action-btn.delete-btn:hover { color: #dc2626; }

        /* Right Panel: Exact Repr. Player Container */
        .player-container {
            background-color: var(--card-bg);
            border-radius: 32px;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            width: 100%;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding: 0 8px;
        }

        .top-bar i {
            font-size: 20px;
            color: var(--accent);
            cursor: pointer;
        }

        .track-info {
            font-size: 17px;
            font-weight: 400;
            color: #2c2c2c;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: -0.3px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Album Cover Box with Bold Visible Shadow */
        .album-art-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: linear-gradient(135deg, #eef1f4, #e0e5ec);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.35), 
                        0 10px 15px -5px rgba(0, 0, 0, 0.2);
            margin-bottom: 35px;
        }

        .audio-wave-icon {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .audio-wave-icon span {
            display: block;
            width: 3px;
            background-color: #4a5568;
            border-radius: 2px;
        }

        .audio-wave-icon span:nth-child(1),
        .audio-wave-icon span:nth-child(5) { height: 12px; }
        .audio-wave-icon span:nth-child(2),
        .audio-wave-icon span:nth-child(4) { height: 18px; }
        .audio-wave-icon span:nth-child(3) { height: 24px; }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-bottom: 24px;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2.5; 
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .control-btn:active {
            opacity: 0.6;
        }

        .play-pause-btn {
            width: 52px;
            height: 52px;
            background-color: var(--accent);
            color: #ffffff;
            border-radius: 50%;
            font-size: 16px;
        }

        /* Time Badge */
        .time-badge {
            background-color: #4e5359;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            margin-bottom: 28px;
        }

        .time-badge span {
            opacity: 0.5;
        }

        /* Fully Interactive Smooth Waveform Architecture */
        .waveform-scroll-window {
            width: 100%;
            height: 50px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .waveform-container {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 100%;
            width: 100%;
        }

        .wave-bar {
            flex: 1;
            height: 10px;
            border-radius: 1px;
            pointer-events: none; 
        }

        .wave-bar.played {
            background-color: var(--wave-played);
        }

        .wave-bar.remaining {
            background-color: var(--wave-remaining);
        }

        /* Responsive Mobile Layout Strategy */
        @media (max-width: 850px) {
            body {
                padding: 12px;
                align-items: flex-start;
            }

            .app-container {
                grid-template-columns: 1fr;
                gap: 24px;
                max-width: 440px;
                margin: 0 auto;
            }

            .dashboard {
                padding: 20px;
            }

            .player-container {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="dashboard">
            <div class="dashboard-title">
                <i class="fa-solid fa-sliders"></i> Track Manager
            </div>
            
            <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Drag & drop your audio file or <strong>browse</strong></p>
                <input type="file" id="file-input" accept="audio/*">
            </div>

            <input type="hidden" id="edit-index" value="-1">
            
            <div class="form-group">
                <label id="form-action-label" for="track-name-input">Track Title Display Text</label>
                <input type="text" id="track-name-input" placeholder="Change item label display configuration">
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label for="fake-min-input">Fake Duration (Min)</label>
                    <input type="number" id="fake-min-input" placeholder="e.g. 2" min="0">
                </div>
                <div>
                    <label for="fake-sec-input">Fake Duration (Sec)</label>
                    <input type="number" id="fake-sec-input" placeholder="e.g. 21" min="0" max="59">
                </div>
            </div>

            <button class="primary-btn" id="save-track-btn">Apply Track Metadata Change</button>

            <div class="track-list-container">
                <div class="track-list-title">Audio Playlist Queue</div>
                <div class="track-list" id="track-list-target">
                    </div>
            </div>
        </div>

        <div class="player-container">
            <div class="top-bar">
                <i class="fa-solid fa-chevron-down"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>

            <div class="track-info" id="player-track-title">Loading track data...</div>

            <div class="album-art-container">
                <div class="audio-wave-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" id="prev-btn" aria-label="Previous Track">
                    <svg viewBox="0 0 24 24">
                        <polygon points="19 20 9 12 19 4 19 20"></polygon>
                        <line x1="5" y1="4" x2="5" y2="20"></line>
                    </svg>
                </button>
                <button class="control-btn play-pause-btn" id="play-btn" aria-label="Play or Pause">
                    <i class="fa-solid fa-play" id="play-icon"></i>
                </button>
                <button class="control-btn" id="next-btn" aria-label="Next Track">
                    <svg viewBox="0 0 24 24">
                        <polygon points="5 4 15 12 5 20 5 4"></polygon>
                        <line x1="19" y1="4" x2="19" y2="20"></line>
                    </svg>
                </button>
            </div>

            <div class="time-badge" id="player-time-badge">
                00:00 <span>| 00:00</span>
            </div>

            <div class="waveform-scroll-window" id="waveform-window">
                <div class="waveform-container" id="waveform-track-timeline">
                    </div>
            </div>
        </div>

    </div>

    <audio id="native-audio-node" preload="auto"></audio>

    <script>
        // Track Library Configuration List Store Objects
        let tracks = [
            { name: "4. ONDEADON - Tito Double P", url: "", isPlaceholder: true, placeholderDuration: 141, fakeDuration: 141 },
            { name: "1. Dembow Belico - Luis R Conriquez", url: "", isPlaceholder: true, placeholderDuration: 185, fakeDuration: 185 },
            { name: "2. AMG - Peso Pluma x Natanael Cano", url: "", isPlaceholder: true, placeholderDuration: 164, fakeDuration: 164 }
        ];

        let currentTrackIndex = 0;
        const barResolutionDensity = 75; 
        let waveformHeightsMap = [];
        let mockPlaceholderTime = 73; // Default 1:13 for initial placeholder demo state

        // UI View Element Access Nodes
        const audioNode = document.getElementById('native-audio-node');
        const playerTrackTitle = document.getElementById('player-track-title');
        const playerTimeBadge = document.getElementById('player-time-badge');
        const playIcon = document.getElementById('play-icon');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const waveformTimeline = document.getElementById('waveform-track-timeline');
        const waveformWindow = document.getElementById('waveform-window');
        
        const trackListTarget = document.getElementById('track-list-target');
        const trackNameInput = document.getElementById('track-name-input');
        const fakeMinInput = document.getElementById('fake-min-input');
        const fakeSecInput = document.getElementById('fake-sec-input');
        const saveTrackBtn = document.getElementById('save-track-btn');
        const editIndexInput = document.getElementById('edit-index');
        const formActionLabel = document.getElementById('form-action-label');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        // Application Runtime Entrance Configuration Routine
        function initializeApplication() {
            generateWaveformTemplateProfile();
            renderDashboardPlaylist();
            loadTargetTrackInstance(currentTrackIndex, false);
            setupEventInteractions();
        }

        // Generate normalized visualization node layouts for rendering execution
        function generateWaveformTemplateProfile() {
            waveformHeightsMap = [];
            for (let i = 0; i < barResolutionDensity; i++) {
                let height = 14 + Math.sin(i * 0.22) * 12 + Math.cos(i * 0.45) * 8;
                height = Math.max(8, Math.min(46, height));
                waveformHeightsMap.push(height);
            }
        }

        function formatTimeMetrics(totalSeconds) {
            if (isNaN(totalSeconds) || totalSeconds < 0) return "00:00";
            const mins = Math.floor(totalSeconds / 60);
            const secs = Math.floor(totalSeconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Active Track Element Selection Setup Execution
        function loadTargetTrackInstance(index, triggerPlayback = false) {
            if (index < 0 || index >= tracks.length) return;
            
            audioNode.pause();
            currentTrackIndex = index;
            const track = tracks[currentTrackIndex];
            
            playerTrackTitle.innerText = track.name;
            
            if (track.isPlaceholder) {
                audioNode.src = ""; 
                audioNode.currentTime = 0;
                // Use fake duration to scale visualization matrix layout directly
                updateWaveformScrubView(mockPlaceholderTime, track.fakeDuration || track.placeholderDuration); 
            } else {
                audioNode.src = track.url;
                audioNode.load();
                audioNode.currentTime = 0;
                
                audioNode.onloadedmetadata = function() {
                    calculateAndSyncFakeProgress();
                };
            }

            if (triggerPlayback && !track.isPlaceholder) {
                audioNode.play().catch(err => console.log("Playback interaction deferred"));
            }
            
            updatePlayPauseButtonUIState();
            renderDashboardPlaylist();
        }

        // Mathematical conversion logic mapping absolute audio timing curves directly onto fake custom duration parameters
        function calculateAndSyncFakeProgress() {
            const track = tracks[currentTrackIndex];
            if (track.isPlaceholder) return;

            const nativeCurrent = audioNode.currentTime;
            const nativeDuration = audioNode.duration || 1;
            const targetFakeMax = track.fakeDuration || nativeDuration;

            // Scale progression percentages natively
            const linearPlayPercentage = nativeCurrent / nativeDuration;
            const computedFakeCurrentTime = linearPlayPercentage * targetFakeMax;

            updateWaveformScrubView(computedFakeCurrentTime, targetFakeMax);
        }

        // Synchronize interface timelines based on real or simulated states
        function updateWaveformScrubView(currentSeconds, totalDuration) {
            totalDuration = totalDuration || 120; 
            const progressRatio = Math.min(1, Math.max(0, currentSeconds / totalDuration));
            const splitActiveIndex = Math.floor(progressRatio * barResolutionDensity);

            playerTimeBadge.innerHTML = `${formatTimeMetrics(currentSeconds)} <span>| ${formatTimeMetrics(totalDuration)}</span>`;

            waveformTimeline.innerHTML = '';
            for (let i = 0; i < barResolutionDensity; i++) {
                const bar = document.createElement('div');
                bar.classList.add('wave-bar');
                bar.style.height = `${waveformHeightsMap[i]}px`;
                
                if (i <= splitActiveIndex) {
                    bar.classList.add('played');
                } else {
                    bar.classList.add('remaining');
                }
                waveformTimeline.appendChild(bar);
            }
        }

        function updatePlayPauseButtonUIState() {
            if (!audioNode.paused && audioNode.src !== "") {
                playIcon.className = "fa-solid fa-pause";
            } else {
                playIcon.className = "fa-solid fa-play";
            }
        }

        // Setup Runtime Interface Binding Handlers
        function setupEventInteractions() {
            // Audio Event Loop Sync Engine Hook
            audioNode.addEventListener('timeupdate', () => {
                if(!tracks[currentTrackIndex].isPlaceholder) {
                    calculateAndSyncFakeProgress();
                }
            });

            audioNode.addEventListener('play', updatePlayPauseButtonUIState);
            audioNode.addEventListener('pause', updatePlayPauseButtonUIState);
            audioNode.addEventListener('ended', () => {
                executeNavigationStep(1);
            });

            // Native Media Player Actions Execution Click Handlers
            playBtn.addEventListener('click', () => {
                const track = tracks[currentTrackIndex];
                if (track.isPlaceholder) {
                    alert("This placeholder configuration requires a real audio file asset upload instantiation first.");
                    return;
                }
                if (audioNode.paused) {
                    audioNode.play();
                } else {
                    audioNode.pause();
                }
                updatePlayPauseButtonUIState();
            });

            prevBtn.addEventListener('click', () => executeNavigationStep(-1));
            nextBtn.addEventListener('click', () => executeNavigationStep(1));

            // Scrubber Click Integration Handler Mapping
            waveformWindow.addEventListener('click', (e) => {
                const track = tracks[currentTrackIndex];
                const rect = waveformWindow.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const ratio = Math.min(1, Math.max(0, clickX / rect.width));

                if (track.isPlaceholder) {
                    const targetFakeMax = track.fakeDuration || track.placeholderDuration;
                    mockPlaceholderTime = Math.floor(ratio * targetFakeMax);
                    updateWaveformScrubView(mockPlaceholderTime, targetFakeMax);
                } else {
                    if (audioNode.duration) {
                        // Reverse matrix calculation to find corresponding native time from fake progress scrub ratio click events
                        audioNode.currentTime = ratio * audioNode.duration;
                        calculateAndSyncFakeProgress();
                    }
                }
            });

            // Native Media Management Asset Import Integrations
            fileInput.addEventListener('change', (e) => handleImportedFilesList(e.target.files));

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = "var(--accent)";
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.style.borderColor = "#d1d5db";
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = "#d1d5db";
                handleImportedFilesList(e.dataTransfer.files);
            });
        }

        function executeNavigationStep(direction) {
            let target = currentTrackIndex + direction;
            if (target < 0) target = tracks.length - 1;
            if (target >= tracks.length) target = 0;
            mockPlaceholderTime = 0; // Reset placeholder track timeline simulation anchor state pointer
            loadTargetTrackInstance(target, true);
        }

        // File Parsing Logic Process Instantiation
        function handleImportedFilesList(filesList) {
            if (!filesList || filesList.length === 0) return;
            
            const file = filesList[0];
            if (!file.type.startsWith('audio/')) {
                alert("Please select a valid audio file format option.");
                return;
            }

            const trackObjectUrl = URL.createObjectURL(file);
            const cleanUploadedTrackName = file.name.replace(/\.[^/.]+$/, "");

            const newTrackDataStructure = {
                name: cleanUploadedTrackName,
                url: trackObjectUrl,
                isPlaceholder: false,
                fakeDuration: null // Calculated dynamically unless manually overridden by input forms panel later
            };

            tracks.push(newTrackDataStructure);
            renderDashboardPlaylist();
            loadTargetTrackInstance(tracks.length - 1, true);
        }

        // Render Management UI Workspace Components
        function renderDashboardPlaylist() {
            trackListTarget.innerHTML = '';
            tracks.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `track-item ${idx === currentTrackIndex ? 'active' : ''}`;
                
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.action-btn')) return;
                    loadTargetTrackInstance(idx, true);
                });

                // Display custom altered time profile value inside dashboard if specified
                let displayDuration = "Loading...";
                if (track.isPlaceholder) {
                    displayDuration = formatTimeMetrics(track.fakeDuration || track.placeholderDuration);
                } else if (track.fakeDuration) {
                    displayDuration = formatTimeMetrics(track.fakeDuration) + " (Spoofed)";
                } else {
                    displayDuration = "Native Track Time";
                }

                item.innerHTML = `
                    <div class="track-item-info">
                        <div class="track-item-name">${track.name}</div>
                        <div class="track-item-meta">
                            <span>${displayDuration}</span>
                        </div>
                    </div>
                    <div class="track-actions">
                        <button class="action-btn edit-btn" onclick="openMetadataEditor(event, ${idx})" title="Edit Properties & Custom Fake Duration Override"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="action-btn delete-btn" onclick="removeTrackInstance(event, ${idx})" title="Delete Track From Session"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                trackListTarget.appendChild(item);
            });
        }

        window.openMetadataEditor = function(event, idx) {
            event.stopPropagation();
            const targetTrack = tracks[idx];
            trackNameInput.value = targetTrack.name;
            editIndexInput.value = idx;
            formActionLabel.innerText = `Edit Properties (Track #${idx + 1}):`;

            // If a fake duration override is current, split it into fields for editing
            const activeFakeTotal = targetTrack.fakeDuration;
            if (activeFakeTotal) {
                fakeMinInput.value = Math.floor(activeFakeTotal / 60);
                fakeSecInput.value = Math.floor(activeFakeTotal % 60);
            } else {
                fakeMinInput.value = "";
                fakeSecInput.value = "";
            }

            trackNameInput.focus();
        };

        saveTrackBtn.addEventListener('click', () => {
            const inputVal = trackNameInput.value.trim();
            const targetIdx = parseInt(editIndexInput.value, 10);

            if (!inputVal) {
                alert("Please enter a valid display title option value.");
                return;
            }

            if (targetIdx > -1 && targetIdx < tracks.length) {
                tracks[targetIdx].name = inputVal;

                // Handle setting up custom duration fakeout logic overrides
                const mins = parseInt(fakeMinInput.value, 10) || 0;
                const secs = parseInt(fakeSecInput.value, 10) || 0;
                const calculatedFakeTotalSeconds = (mins * 60) + secs;

                if (calculatedFakeTotalSeconds > 0) {
                    tracks[targetIdx].fakeDuration = calculatedFakeTotalSeconds;
                } else {
                    tracks[targetIdx].fakeDuration = null; // Revert back to original baseline calculation properties
                }

                // If currently loaded, sync updates directly onto live runtime players views instantly
                if (targetIdx === currentTrackIndex) {
                    playerTrackTitle.innerText = inputVal;
                    if (tracks[targetIdx].isPlaceholder) {
                        updateWaveformScrubView(mockPlaceholderTime, tracks[targetIdx].fakeDuration || tracks[targetIdx].placeholderDuration);
                    } else {
                        calculateAndSyncFakeProgress();
                    }
                }
                
                // Clear handles smoothly
                editIndexInput.value = "-1";
                trackNameInput.value = "";
                fakeMinInput.value = "";
                fakeSecInput.value = "";
                formActionLabel.innerText = "Track Title Display Text";
                renderDashboardPlaylist();
            } else {
                alert("Select a track item via edit action first to change its properties.");
            }
        });

        window.removeTrackInstance = function(event, idx) {
            event.stopPropagation();
            if (tracks.length <= 1) {
                alert("Cannot clear playlist down entirely.");
                return;
            }

            tracks.splice(idx, 1);
            if (currentTrackIndex >= tracks.length) {
                currentTrackIndex = tracks.length - 1;
            }
            loadTargetTrackInstance(currentTrackIndex, false);
        };

        // Initialize App Container Pipeline
        initializeApplication();
    </script>
</body>
</html>
